server{
    listen 80;
    server_name localhost;

    server_tokens off;

    location /api/ {
        proxy_pass http://crypto-app:8088;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /swagger-ui/{
        allow 192.168.56.1;
        deny all;
        proxy_pass http://crypto-app:8088;
    }

}