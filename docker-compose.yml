services:
  db:
    image: postgres:18-alpine
    container_name: crypto-db
    networks:
      - crypto-net
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: crypto_tracker
    ports:
      - "127.0.0.1:5444:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.2-alpine
    container_name: crypto-redis
    networks:
      - crypto-net
    ports:
      - "6379:6379"
    restart: always

  crypto-app:
    build: .                 
    container_name: crypto-backend
    ports:
      - "8088:8088"          
    depends_on:
      - db                   
      - redis    
    networks:
      - crypto-net            
    environment:
      - COINGECKO_API_KEY=${COINGECKO_API_KEY}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/crypto_tracker
      - SPRING_DATA_REDIS_HOST=redis

  nginx:
    image: nginx:alpine
    container_name: crypto-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/crypto.conf:/etc/nginx/conf.d/crypto.conf:ro
    depends_on:
      - crypto-app           
    networks:
      - crypto-net
  
networks:
  crypto-net:
        driver: bridge
volumes:
  postgres_data:  