services:
  db:
    image: postgres:18-alpine
    container_name: crypto-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: crypto_tracker
    ports:
      - "127.0.0.1:5444:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  crypto-service:
    image: redis:7.2-alpine
    container_name: crypto-redis
    ports: 
      - "6379:6379"
    restart: always
  
volumes:
  postgres_data:  