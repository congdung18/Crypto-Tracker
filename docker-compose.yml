services:
  db:
    image: postgres:18-alpine
    container_name: crypto-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: crypto_tracker
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d crypto_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crypto-backend
    ports:
      - "8088:8088"
    environment:
      DB_URL: jdbc:postgresql://db:5432/crypto_tracker
      DB_USERNAME: admin
      DB_PASSWORD: 123456
      SHOW_SQL: "false"
      COINGECKO_API_KEY: ""
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crypto-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data: