apiVersion: apps/v1
kind: Deployment
metadata:
  name: crypto-tracker-frontend
  labels:
    app: crypto-tracker-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: crypto-tracker-frontend
  template:
    metadata:
      labels:
        app: crypto-tracker-frontend
    spec:
      containers:
        - name: frontend
          image: crypto-tracker-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  labels:
    app: crypto-tracker-frontend
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
  selector:
    app: crypto-tracker-frontend
